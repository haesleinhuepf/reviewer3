[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviewer3"
version = "0.1.1"
description = "A command line tool that uses LLMs to give constructive feedback about scientific .docx manuscripts."
readme = "README.md"
authors = [
  { name = "Robert Haase", email = "robert.haase@uni-leipzig.de" },
]
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "PyYAML>=6.0",
  "python-docx>=1.2.0",
  "tqdm>=4.66.0",
]

[project.scripts]
reviewer3 = "reviewer3.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["reviewer3"]
